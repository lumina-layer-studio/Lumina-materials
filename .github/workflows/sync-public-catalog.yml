name: Sync approved public resources
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths: ['scripts/fetch_public_snapshot.py', 'tests/test_fetch_public_snapshot.py', '.github/workflows/sync-public-catalog.yml']
permissions:
  contents: read
concurrency:
  group: public-catalog-sync
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_fetch_public_snapshot.py
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.PUBLIC_CATALOG_SYNC == 'enabled')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare an anonymous verified snapshot
        run: python scripts/fetch_public_snapshot.py --registry https://dan5.shmx.top/api/material-registry/v1 --cache public/v1 --output "$RUNNER_TEMP/public-snapshot"
      - name: Publish only after every read and checksum succeeded
        run: |
          rsync -a --delete "$RUNNER_TEMP/public-snapshot/" public/v1/
          git add public/v1
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Lumina public catalog'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): sync approved public resources'
          git push origin HEAD:master
